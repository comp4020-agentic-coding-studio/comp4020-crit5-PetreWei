<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Detour">
  <!-- The runner and the exit, set off-axis so the shape reads as going
       around something. Two marks only: a third element (the wall between
       them) turned to mush at 16px, which is the size that actually ships.
       Dark ground so it holds up on a light tab strip as well as a dark one.
       Palette matches the board in src/styles/game.css. -->
  <rect width="32" height="32" rx="7" fill="#2c3949" />
  <circle cx="11" cy="11" r="6.5" fill="#ff4a22" />
  <rect x="17.5" y="17.5" width="11" height="11" rx="2.5" fill="#25c069" />
</svg>
